<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLC2 Attendance Status Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#d9f0ea;
    --card:#FFFFFF;
    --ink:#0B2E4E;
    --pine:#155A9C;
    --pine-dim:#4D7FA8;
    --deep:#0B3D66;
    --sky:#3FA0D8;
    --cyan:#2FB6C4;
    --line:#D3E6F5;
    --red:#3A5578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
  }
  .wrap{width:100%;max-width:480px;}
  .logos{
    display:flex;
    justify-content:center;
    margin:0 0 24px;
  }
  .logos img{
    max-width:260px;
    width:100%;
    height:auto;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.2;
    margin:0 0 6px;
    color:var(--deep);
    text-align:center;
  }
  .sub{margin:0 0 28px;color:var(--pine-dim);font-size:15px;text-align:center;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px;
    box-shadow:0 1px 3px rgba(11,61,102,0.06);
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 4px;
    color:var(--deep);
  }
  .card-sub{
    font-size:13px;
    color:var(--pine-dim);
    margin:0 0 20px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--pine-dim);
    margin:0 0 6px;
  }
  input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    margin-bottom:18px;
    background:#F7FBFE;
  }
  input:focus{outline:2px solid var(--sky);outline-offset:1px;}
  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:7px;
    background:linear-gradient(135deg,var(--sky),var(--pine));
    color:#fff;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
  }
  button:hover{background:var(--pine);}
  button:disabled{opacity:0.6;cursor:default;}
  .msg{font-size:14px;margin-top:14px;color:var(--pine-dim);}
  .msg.err{color:#B0402E;}
  .result{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:none;}
  .badge{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    padding:5px 12px;
    border-radius:99px;
    margin-bottom:10px;
  }
  .badge.ok{background:#D8EEF9;color:#0B3D66;}
  .badge.mid{background:#D3F1F1;color:#0E6C7A;}
  .badge.bad{background:#DCE6F2;color:#284566;}
  .desc{font-size:15px;line-height:1.6;margin:0 0 18px;}
  .desc p{margin:0 0 12px;}
  .desc a{color:var(--pine);font-weight:500;}
  .desc .contact{font-size:13px;color:var(--pine-dim);margin-top:14px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    font-size:13px;
  }
  .book{
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 6px;
    text-align:center;
  }
  .book .n{font-weight:600;display:block;font-size:15px;}
  .book .lbl{font-size:11px;opacity:0.85;}
  .book-green{background:#DEF3E6;border-color:#BCE3C9;}
  .book-green .n{color:#2F7A52;}
  .book-green .lbl{color:#3E8F63;}
  .book-yellow{background:#FBF3D9;border-color:#F0E0A8;}
  .book-yellow .n{color:#8A6D1F;}
  .book-yellow .lbl{color:#9C7E2E;}
  .book-red{background:#F9E0E0;border-color:#F0C2C2;}
  .book-red .n{color:#A23B3B;}
  .book-red .lbl{color:#B4504F;}
  .book-gray{background:#E8EBEF;border-color:#D5DAE1;}
  .book-gray .n{color:#5B6472;}
  .book-gray .lbl{color:#6E7684;}
  .missed{
    font-size:13px;
    color:var(--pine-dim);
    margin:14px 0 0;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:none;
  }
  footer{margin-top:20px;font-size:12px;color:var(--pine-dim);text-align:center;}
</style>
</head>

    html: `<p>You've gone over the allowed absences. You'll need to retake some books, unless you <a href="${FORM_LINK}" target="_blank" rel="noopener">file an appeal</a> — available if there's a data discrepancy to report or a valid reason for being away.</p>${CONTACT_HTML}`
  },
  notfound: {
    label: "Not found",
    css: "bad",
    html: `<p>We couldn't find that ID and last name together in the records. Check for typos, or confirm with your coordinator that your record has been added.</p>`
  }
};
/* ---------- END CONFIG ---------- */

let rows = null; // each row: array of cell values (strings/booleans), column-aligned to the sheet

function loadSheetJSONP(){
  return new Promise((resolve, reject) => {
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    window.google.visualization.Query.setResponse = function(response){
      cleanup();
      if (!response || !response.table || !response.table.rows){
        reject(new Error("bad_response_shape"));
        return;
      }
      resolve(response.table.rows);
    };
    const script = document.createElement("script");
    script.src = GVIZ_URL_BASE + "&_=" + Date.now();
    script.onerror = () => { cleanup(); reject(new Error("script_load_failed")); };
    function cleanup(){ if (script.parentNode) script.parentNode.removeChild(script); clearTimeout(timer); }
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 10000);
    document.body.appendChild(script);
  });
}

function cellValue(cell){
  if (!cell || cell.v === null || cell.v === undefined) return "";
  return cell.v;
}

async function loadSheet(){
  let tableRows;
  try {
    tableRows = await loadSheetJSONP();
  } catch (err){
    console.error("GLC checker: failed to load sheet via gviz:", err);
    throw err;
  }
  rows = tableRows
    .map(r => (r.c || []).map(cellValue))
    .filter(r => {
      const idCell = String(r[0] || "").trim();
      if (!idCell) return false; // blank spacer rows
      if (idCell.toLowerCase() === "trainee number") return false; // header row, wherever it ends up
      return true;
    });
}

function findRow(id, lastName){
  const idN = id.trim().toLowerCase();
  const lnN = lastName.trim().toLowerCase();
  return rows.find(r => String(r[0] || "").toLowerCase() === idN && String(r[1] || "").toLowerCase() === lnN);
}

function evaluate(row){
  let col = 2; // sessions start at column C (index 2)
  let totalAttended = 0;
  const exceeded = [];
  const perBook = [];
  const missed = [];

  BOOKS.forEach(book => {
    let attended = 0;
    for (let i = 0; i < book.sessions; i++){
      const val = row[col + i];
      const isPresent = val === true || String(val).trim().toUpperCase() === "TRUE";
      if (isPresent) attended++;
      else missed.push({ book: book.name, session: i + 1 });
    }
    col += book.sessions;
    totalAttended += attended;
    const absences = book.sessions - attended;
    let colorStatus;
    if (attended === book.sessions) colorStatus = "complete";
    else if (attended === 0) colorStatus = "none";
    else if (absences <= book.allowedAbsences) colorStatus = "within";
    else colorStatus = "exceeded";
    perBook.push({ name: book.name, attended, sessions: book.sessions, colorStatus });
    if (absences > book.allowedAbsences) exceeded.push(book.name);
  });

  let statusKey;
  if (totalAttended === 18) statusKey = "complete";
  else if (exceeded.length === 0) statusKey = "makeup";
  else statusKey = "retake";

  return { statusKey, exceeded, perBook, missed };
}

function formatMissedList(missed){
  const items = missed.map(m => `<strong><em>${m.book} Session ${m.session}</em></strong>`);
  if (items.length === 0) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return items.join(" and ");
  return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
}

function render(statusKey, exceeded, perBook, missed){
  const s = STATUSES[statusKey];
  const badge = document.getElementById("badge");
  const desc = document.getElementById("desc");
  const grid = document.getElementById("grid");
  const missedEl = document.getElementById("missed");

  badge.textContent = s.label;
  badge.className = "badge " + s.css;

  desc.innerHTML = s.html;

  const colorClass = { complete: "book-green", within: "book-yellow", exceeded: "book-red", none: "book-gray" };
  grid.innerHTML = "";
  perBook.forEach(b => {
    const div = document.createElement("div");
    div.className = "book " + colorClass[b.colorStatus];
    div.innerHTML = `<span class="n">${b.attended}/${b.sessions}</span><span class="lbl">${b.name}</span>`;
    grid.appendChild(div);
  });

  if (missed && missed.length > 0){
    missedEl.innerHTML = "You missed " + formatMissedList(missed) + ".";
    missedEl.style.display = "block";
  } else {
    missedEl.innerHTML = "";
    missedEl.style.display = "none";
  }

  document.getElementById("result").style.display = "block";
}

async function checkStatus(){
  const id = document.getElementById("sid").value;
  const lastName = document.getElementById("lname").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("checkBtn");
  document.getElementById("result").style.display = "none";
  msg.textContent = "";
  msg.className = "msg";

  if (!id.trim() || !lastName.trim()){
    msg.textContent = "Please enter both your ID and last name.";
    msg.className = "msg err";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Checking...";

  try {
    await loadSheet();
    const row = findRow(id, lastName);
    if (!row){
      const s = STATUSES.notfound;
      document.getElementById("badge").textContent = s.label;
      document.getElementById("badge").className = "badge " + s.css;
      document.getElementById("desc").innerHTML = s.html;
      document.getElementById("grid").innerHTML = "";
      document.getElementById("missed").style.display = "none";
      document.getElementById("result").style.display = "block";
    } else {
      const { statusKey, exceeded, perBook, missed } = evaluate(row);
      render(statusKey, exceeded, perBook, missed);
    }
  } catch (e){
    msg.textContent = "Couldn't load the attendance sheet right now. Please try again in a moment.";
    msg.className = "msg err";
  } finally {
    btn.disabled = false;
    btn.textContent = "Check my status";
  }
}

document.getElementById("checkBtn").addEventListener("click", checkStatus);
document.getElementById("lname").addEventListener("keydown", e => { if (e.key === "Enter") checkStatus(); });
</script>
